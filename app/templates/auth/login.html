{% extends "base.html" %}
{% block title %}Log In{% endblock %}

{% block content %}
<div class="flex justify-center">
  <div class="card" style="max-width: 420px; width: 100%; margin-top: var(--space-6);">
    <div class="page-header mb-4">
      <h1 class="text-xl font-bold">Welcome back</h1>
      <p class="text-sm">Log in to pick up where you left off.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-control" type="email" id="email" name="email"
               value="{{ email or '' }}" placeholder="you@university.edu" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password"
               placeholder="Your password" required>
      </div>

      <div class="form-group flex items-center gap-2">
        <input type="checkbox" id="remember" name="remember" style="width:auto;">
        <label for="remember" class="text-sm text-muted" style="margin-bottom:0;">Remember me</label>
      </div>

      <button type="submit" class="btn btn-primary w-full justify-center">Log in</button>
    </form>

    <p class="text-sm text-muted mt-4" style="text-align:center;">
      New to FlowNest? <a href="{{ url_for('auth.register') }}" style="color: var(--color-primary-dark); font-weight:600;">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}
